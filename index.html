<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anis Cipher - Consecutive Square Cryptography System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Anis Cipher - Consecutive Square Difference Cipher</h2>
        <p class="subtitle"><a href="https://programming24.school.blog/wp-content/uploads/2026/06/my-cryptography-paper.pdf " target="_blank">Based on the research paper by Md. Anisur Rahman</a></p>
        
        <div class="form-group">
            <label for="messageInput">Message:</label>
            <textarea id="messageInput" placeholder="Enter plaintext to encrypt or ciphertext to decrypt..."></textarea>
        </div>

        <div class="form-group">
            <label for="keyInput">Secret Key:</label>
            <input type="number" id="keyInput" value="3" min="1" placeholder="Enter an integer key">
        </div>

        <div class="button-group">
            <button id="encryptBtn" class="btn btn-encrypt">Encrypt</button>
            <button id="decryptBtn" class="btn btn-decrypt">Decrypt</button>
        </div>

        <div class="output-box">
            <h3>Resulting Output:</h3>
            <div id="outputMessage" class="placeholder-text">Your processed message output will appear here.</div>
        </div>
    </div>

    <script src="crypt.js"></script>
</body>
</html>
