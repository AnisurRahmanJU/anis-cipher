<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anis Cipher - Consecutive Square Cryptography System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Anis Cipher - Consecutive Square Difference Cipher</h2>
        <p class="subtitle">Based on the research paper by Md. Anisur Rahman</p>
        
        <div class="form-group">
            <label for="messageInput">Message:</label>
            <textarea id="messageInput" placeholder="Enter plaintext to encrypt or ciphertext tokens to decrypt..."></textarea>
        </div>

        <div class="form-group">
            <label for="keyInput">Secret Key (Integer $K$):</label>
            <input type="number" id="keyInput" value="3" min="1" placeholder="Enter an integer key">
        </div>

        <div class="button-group">
            <button id="encryptBtn" class="btn btn-encrypt">Encrypt</button>
            <button id="decryptBtn" class="btn btn-decrypt">Decrypt</button>
        </div>

        <div class="output-box">
            <h3>Resulting Output:</h3>
            <div id="outputMessage" class="placeholder-text">Your processed message output will appear here.</div>
        </div>
    </div>

    <script src="crypt.js"></script>
</body>
</html>
